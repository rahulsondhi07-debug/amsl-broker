<!--
  Utility Live brand marks.
   - #mark      square app icon (sidebar, favicon)
   - #wordmark  full lockup (login screen, documents)
  The mark is a live price line: a rising trace with a pulse point at its head, which is
  what the product actually shows - a position moving in real time, not a static rate.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200" role="img" aria-label="Utility Live">
  <defs>
    <linearGradient id="ul-tile" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="184" y2="184">
      <stop offset="0%" stop-color="#0E7C7B"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="ul-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E7C7B"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <g id="mark">
    <rect x="16" y="16" width="168" height="168" rx="44" fill="url(#ul-tile)"/>
    <!-- the trace -->
    <path d="M52 132 L82 104 L106 118 L142 68" fill="none" stroke="#fff" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- live pulse at the head of the line -->
    <circle cx="142" cy="68" r="19" fill="#fff" opacity="0.28"/>
    <circle cx="142" cy="68" r="10" fill="#fff"/>
  </g>

  <g id="wordmark">
    <text x="214" y="118" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="72" font-weight="400" fill="#0F172A" letter-spacing="-1">utility</text>
    <text x="436" y="118" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="72" font-weight="800" fill="url(#ul-grad)">live</text>
    <text x="216" y="152" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="19" font-weight="500" fill="#64748B" letter-spacing="3.5">ENERGY BROKERAGE</text>
  </g>
</svg>
